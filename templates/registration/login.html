{% extends 'base.html' %}
{% block title %}Accedi{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-sm-8 col-md-6 col-lg-4">
        <div class="py-4 py-md-5">
            <h3 class="fw-bold mb-1">Accedi</h3>
            <p class="small mb-4" style="color: var(--pencil);">Inserisci le tue credenziali per entrare nella tua area.</p>

            <form method="post">
                {% csrf_token %}
                {% if form.errors %}
                    <div class="alert alert-danger py-2 small d-flex align-items-center gap-2">
                        <i class="bi bi-exclamation-circle-fill" style="color: var(--bordeaux);"></i>
                        <span>Username o password non corretti.</span>
                    </div>
                {% endif %}
                <div class="mb-3">
                    <label class="form-label" for="id_username">Username</label>
                    <input type="text" name="username" id="id_username" class="form-control" autofocus required>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="id_password">Password</label>
                    <input type="password" name="password" id="id_password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Accedi</button>
            </form>

            <hr class="my-4" style="border-color: var(--rule);">
            <p class="text-center small mb-0" style="color: var(--pencil);">
                Non hai ancora un account?
                <a href="{% url 'register' %}" class="fw-bold">Registrati</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
