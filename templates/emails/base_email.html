<!DOCTYPE html>
<html>
<head>
    <style>
        /* Nota Tecnica: I client di posta (specialmente Outlook) sono tremendi con il CSS moderno.
           Qui usiamo uno stile "safe": tabelle implicite, niente Flexbox complesso, font standard.
        */
        body { font-family: Arial, Helvetica, sans-serif; color: #211a1c; line-height: 1.6; margin: 0; padding: 0; background-color: #efe8e0; }

        .container { max-width: 600px; margin: 20px auto; background-color: #faf7f2; border-radius: 12px; overflow: hidden; border: 1px solid #ddd3c8; }

        .header { background-color: #6b2737; color: #f5f1ec; padding: 30px 20px; text-align: center; }

        .content { padding: 40px 30px; }
        .footer { background-color: #f3ede4; padding: 20px; text-align: center; font-size: 12px; color: #8a8178; border-top: 1px solid #ddd3c8; }

        .btn { display: inline-block; padding: 12px 24px; background-color: #6b2737; color: #f5f1ec !important; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 20px; }

        .info-box { background-color: #f3ede4; padding: 20px; border-radius: 8px; margin: 20px 0; border-left: 3px solid #6b2737; }
        .info-label { font-weight: bold; color: #5c5550; font-size: 11px; letter-spacing: 0.3px; }

        h1 { margin: 0; font-size: 26px; font-weight: bold; font-family: Georgia, 'Times New Roman', serif; }
        h3 { color: #211a1c; margin-top: 0; font-family: Georgia, 'Times New Roman', serif; }
        a { color: #6b2737; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>FG Ripetizioni</h1>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        <div class="footer">
            &copy; {% now "Y" %} Francesco Gori<br>
            <a href="http://francescogori03.eu.pythonanywhere.com" style="color: #8a8178; text-decoration: none;">Gestisci le tue lezioni online</a>
        </div>
    </div>
</body>
</html>
